org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.log.io.javalin=warn
# These only report Pro DJ Link packets beat-link does not know yet. The XDJ-AZ sends some (type 0x80 on port 50002,
# status packets with an inconsistent length) on every start. Set the level back to warn with
# -Dorg.slf4j.simpleLogger.log.org.deepsymmetry.beatlink.Util=warn (and .CdjStatus=warn) when investigating a new device.
org.slf4j.simpleLogger.log.org.deepsymmetry.beatlink.Util=error
org.slf4j.simpleLogger.log.org.deepsymmetry.beatlink.CdjStatus=error
