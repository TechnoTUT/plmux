<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>plmux</title>
    <script>
      // 初回描画前にテーマを適用してちらつきを防ぐ (既定はライト。moip-toolkit と同じ)
      // ?theme=dark / ?theme=light で指定も可能 (ブース用ディスプレイ向け)
      var theme = new URLSearchParams(location.search).get('theme')
      try {
        if (theme) localStorage.setItem('plmux-theme', theme)
        else theme = localStorage.getItem('plmux-theme')
      } catch (e) {}
      if (theme === 'dark') document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
